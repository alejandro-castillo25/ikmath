<svg
  xmlns="http://www.w3.org/2000/svg"
  width="400"
  height="400"
  viewBox="0 0 100 100"
  fill="none"
>
  <defs>
    <style>
      :root {
        --logo-bg-color: #eff1f5;
        --logo-text-color: #4c4f69;
      }
      @media (prefers-color-scheme: dark) {
        :root {
         --logo-bg-color: #1e1e2e;
         --logo-text-color: #cdd6f4;
        }
      }

      .transform {
        transform-origin: center;
      }

      .text-part {
        font-family: 'Libron', Georgia,  "Times New Roman", serif;
        font-size: 52px;
      }
    </style>

    <clipPath id="deltaClip">
      <rect x="8" y="8" width="84" height="82.98" class="transform" />
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="var(--logo-bg-color)" rx="10"/>
  <path
    class="transform"
    fill="none"
    stroke="var(--logo-text-color)"
    stroke-width="2"
    transform="scale(1.18)"
    clip-path="url(#deltaClip)"
    d="
      M 10 90 L 90 90 L 50 10 Z

      M 11 88 L 89 88
      M 12 86 L 88 86
      M 13 84 L 87 84

      M 88 88 L 50 12
      M 87 89 L 49 13
      M 86 90 L 48 14
      M 85 91 L 47 15
    "
  />

  <text
    x="50"
    y="68"
    text-anchor="middle"
    dominant-baseline="central"
    class="text-part"
    fill="var(--logo-text-color)"
  >ik</text>
</svg>
